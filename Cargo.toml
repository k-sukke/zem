[package]
name = "zem"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
description = "Zephyr Environment Manager: declarative, isolated Zephyr RTOS environments"
license = "MIT"
repository = "https://github.com/k-sukke/zem"
homepage = "https://github.com/k-sukke/zem"
readme = "README.md"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
console = "0.16.6"
dialoguer = "0.12.0"
dunce = "1.0.5"
home = "0.5.12"
indicatif = "0.18.6"
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
serialport = { version = "4.10.1", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
toml = "1.2.3"
which = "8.0.6"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
ureq = "3.5.2"

[target.'cfg(windows)'.dependencies]
sevenz-rust2 = { version = "0.27.0", default-features = false, features = ["util"] }
ureq = { version = "3.5.2", default-features = false, features = ["gzip", "native-tls-no-default"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.27.0", default-features = false, features = ["compress", "util"] }
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
